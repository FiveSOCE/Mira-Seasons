name: Release v0.1.0
on:
  push:
    paths:
      - '.github/workflows/release-v0.1.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: afa6a371b0e437efb8a4c94e19fd6e07e6c1cdf7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle clean build
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: MiraSeasons v0.1.0
          target_commitish: afa6a371b0e437efb8a4c94e19fd6e07e6c1cdf7
          body: Initial MiraSeasons release with persistent season lifecycle, current-season source of truth, winner archive, automatic expiry, PlaceholderAPI and public ServicesManager API.
          files: build/libs/MiraSeasons-0.1.0.jar
